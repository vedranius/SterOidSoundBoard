[package]
name = "steroidsoundboard"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
steroid-engine = { path = "../engine" }
steroid-clinic = { path = "../clinic" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
mime_guess = "2"
webbrowser = "1"
dirs = "5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
local-ip-address = "0.6"
# AI providers: blocking HTTPS client with rustls (ring) — no OpenSSL/cmake needed on any target
ureq = { version = "2", features = ["json", "tls", "proxy-from-env"] }
base64 = "0.22"
# Login: Argon2id password/PIN hashes, random session tokens (pure Rust, every target)
argon2 = { version = "0.5", features = ["std"] }
getrandom = "0.2"
# Backup/restore of the data directory as a .zip (stored entries, same as the browser edition)
zip = { version = "2", default-features = false }
tokio-util = { version = "0.7", features = ["io"] }
