[package]
name = "steroid-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The browser edition: engine + clinic logic as one WebAssembly module (plain C ABI,
# JSON in/out, no JS glue generator needed).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
steroid-engine = { path = "../engine", default-features = false }
steroid-clinic = { path = "../clinic" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hound = "3.5"
