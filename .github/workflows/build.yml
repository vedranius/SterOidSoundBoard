name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04        # older glibc = runs on more distros
            bin: steroidsoundboard
          - name: linux-arm64       # Raspberry Pi 4/5 (64-bit OS)
            os: ubuntu-22.04-arm
            bin: steroidsoundboard
          - name: windows-x64
            os: windows-latest
            bin: steroidsoundboard.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Test
        run: cargo test -p steroid-engine --lib
      - name: Build
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          VER=$(cat VERSION)
          OUT=steroidsoundboard-$VER-${{ matrix.name }}
          mkdir -p dist/$OUT
          cp target/release/${{ matrix.bin }} README.md CHANGELOG.md LICENSE dist/$OUT/
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cp packaging/linux/* dist/$OUT/
            tar -C dist -czf dist/$OUT.tar.gz $OUT
          else
            (cd dist && 7z a -tzip $OUT.zip $OUT >/dev/null)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: steroidsoundboard-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  # Browser edition: engine + clinic logic as WebAssembly, static site in dist/.
  web:
    runs-on: ubuntu-22.04
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the WebAssembly interface (native)
        run: cargo test -p steroid-web
      - name: Build
        run: tools/build-web.sh dist/web
      - name: WebAssembly gives the same measures as the native engine
        run: |
          cargo build --release -p steroid-web --example analyze
          mkdir -p /tmp/sig && (cd /tmp/sig && python3 "$GITHUB_WORKSPACE/tools/make_test_signals.py")
          node tools/check-wasm.js /tmp/sig/*.wav
      - name: Package
        run: |
          VER=$(cat VERSION)
          (cd dist/web && zip -qr ../steroidsoundboard-$VER-web.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: steroidsoundboard-web
          path: dist/*.zip
      # Needs the repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
      - name: Deploy to Cloudflare Pages (steroidsoundboard.geekranius.stream)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/web --project-name=steroidsoundboard --branch=main --commit-dirty=true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          VER=${GITHUB_REF_NAME#v}
          awk -v v="$VER" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
